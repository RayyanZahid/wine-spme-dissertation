# Wine SPME Arrow GC-MS/MS — MRM Transition Database
#
# Source: extracted from _research/04_mrm_optimization.md, cross-validated against
# Agilent 5994-3161EN, Agilent 5990-4968EN, Agilent 5991-3682EN, Agilent 5991-1031EN,
# Thermo TSQ AppsLab #4532, PMC7407152, Razaq 2023 (PMC10835727),
# Schreier & Wuest 2016 ABC, Pollnitz 1996, Hjelmeland 2010, Slabizki & Schmarr 2014.
#
# Schema per compound:
#   name        — common name
#   class       — methoxypyrazine | norisoprenoid | haloanisole | smoke_phenol |
#                 monoterpene | ester | higher_alcohol | aldehyde |
#                 musty | sulfur | oxidative
#   formula     — molecular formula
#   mw          — molecular weight (Da)
#   cas         — CAS number
#   rt          — retention time estimate (min, on DB-WAX 60m unless noted)
#   column      — DB-WAX | DB-5MS | DB-5
#   transitions — list of {precursor, product, ce_ev, role, source}
#                 role: quan | qual | confirm | isotope
#   matrix      — wine | water | solvent_only (for threshold/range entries)
#   threshold   — sensory threshold in wine, in same units as range (ng/L | µg/L | mg/L)
#   threshold_units
#   range_cabsauv — typical concentration range reported in Cabernet Sauvignon
#   range_units
#   descriptor  — odor descriptor (e.g., "green pepper", "raspberry-jam")
#   marker_type — varietal | fermentation | fault | smoke_taint | brett | oak
#   derivatization — none | PFBHA | PFB-extractive-alkylation | DTDP
#   internal_standard — recommended IS for SIDA quan
#
# This is the authoritative analyte panel for the dissertation MRM method.

version: 1
adopted_2026_05_12: true
default_acceptance: "SANTE/11312/2021 ±30%"
fallback_acceptance: "2002/657/EC sliding scale (±50% when Q<10% of Quan)"

